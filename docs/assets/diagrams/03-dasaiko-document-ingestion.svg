<rect x="0" y="0" width="1240" height="1300" fill="#0A0A0E"/><text x="60" y="56" font-family="-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#F2F1F7" text-anchor="start">Dasaiko — Document Ingestion Pipeline</text><text x="60" y="78" font-family="-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#8E8CA0" text-anchor="start">How an uploaded research PDF becomes searchable evidence</text><rect x="200.0" y="118" width="460" height="68" rx="10" ry="10" fill="#17171F" stroke="#4C3D73" stroke-width="1.6"/><rect x="200.0" y="118" width="3.5" height="68" rx="0" ry="0" fill="#8B5CF6" stroke="none" stroke-width="0"/><text x="430.0" y="146.0" font-family="-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#F2F1F7" text-anchor="middle">PDF Upload</text><text x="430.0" y="164.0" font-family="-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#8E8CA0" text-anchor="middle">user submits a research paper via the workspace</text><line x1="430" y1="186" x2="430" y2="270" stroke="#3D3D4A" stroke-width="1.3" marker-end="url(#arrow-neutral)"/><rect x="475.9" y="219.75" width="100.2" height="16.5" rx="5" ry="5" fill="#0A0A0E" stroke="none" stroke-width="0"/><text x="526" y="231.675" font-family="-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#5F5D70" text-anchor="middle" letter-spacing="0.3px">multipart/form</text><rect x="200.0" y="270" width="460" height="68" rx="10" ry="10" fill="#17171F" stroke="#31313D" stroke-width="1.2"/><text x="430.0" y="298.0" font-family="-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#F2F1F7" text-anchor="middle">File Storage</text><text x="430.0" y="316.0" font-family="-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#8E8CA0" text-anchor="middle">saved to disk · served statically at /uploads</text><line x1="430" y1="338" x2="430" y2="422" stroke="#3D3D4A" stroke-width="1.3" marker-end="url(#arrow-neutral)"/><rect x="200.0" y="422" width="460" height="68" rx="10" ry="10" fill="#17171F" stroke="#4C3D73" stroke-width="1.6"/><rect x="200.0" y="422" width="3.5" height="68" rx="0" ry="0" fill="#8B5CF6" stroke="none" stroke-width="0"/><text x="430.0" y="450.0" font-family="-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#F2F1F7" text-anchor="middle">PDF Parsing</text><text x="430.0" y="468.0" font-family="-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#8E8CA0" text-anchor="middle">PyMuPDF (fitz) · page text, blocks, line bounding boxes</text><line x1="430" y1="490" x2="430" y2="574" stroke="#3D3D4A" stroke-width="1.3" marker-end="url(#arrow-neutral)"/><rect x="469.6" y="523.75" width="112.8" height="16.5" rx="5" ry="5" fill="#0A0A0E" stroke="none" stroke-width="0"/><text x="526" y="535.675" font-family="-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#5F5D70" text-anchor="middle" letter-spacing="0.3px">per page, lazily</text><rect x="200.0" y="574" width="460" height="68" rx="10" ry="10" fill="#17171F" stroke="#31313D" stroke-width="1.2"/><text x="430.0" y="602.0" font-family="-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#F2F1F7" text-anchor="middle">Chunking</text><text x="430.0" y="620.0" font-family="-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#8E8CA0" text-anchor="middle">LangChain RecursiveCharacterTextSplitter · 1000 / 200 overlap</text><line x1="430" y1="642" x2="430" y2="726" stroke="#3D3D4A" stroke-width="1.3" marker-end="url(#arrow-neutral)"/><rect x="200.0" y="726" width="460" height="76" rx="10" ry="10" fill="#17171F" stroke="#4C3D73" stroke-width="1.6"/><rect x="200.0" y="726" width="3.5" height="76" rx="0" ry="0" fill="#8B5CF6" stroke="none" stroke-width="0"/><text x="430.0" y="758.0" font-family="-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#F2F1F7" text-anchor="middle">Chunk Metadata</text><text x="430.0" y="776.0" font-family="-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#8E8CA0" text-anchor="middle">page number · chunk index · page size · bounding boxes · token count</text><line x1="430" y1="802" x2="430" y2="886" stroke="#8B5CF6" stroke-width="1.6" marker-end="url(#arrow-accent)"/><rect x="491.65" y="835.75" width="68.69999999999999" height="16.5" rx="5" ry="5" fill="#0A0A0E" stroke="none" stroke-width="0"/><text x="526" y="847.675" font-family="-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#A78BFA" text-anchor="middle" letter-spacing="0.3px">per chunk</text><rect x="200.0" y="886" width="460" height="68" rx="10" ry="10" fill="#17171F" stroke="#31313D" stroke-width="1.2"/><text x="430.0" y="914.0" font-family="-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#F2F1F7" text-anchor="middle">Embedding Generation</text><text x="430.0" y="932.0" font-family="-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#8E8CA0" text-anchor="middle">384-dim · MiniLM-L6-v2 (local) or Hugging Face (remote)</text><line x1="430" y1="954" x2="430" y2="1038" stroke="#8B5CF6" stroke-width="1.6" marker-end="url(#arrow-accent)"/><rect x="501.1" y="987.75" width="49.8" height="16.5" rx="5" ry="5" fill="#0A0A0E" stroke="none" stroke-width="0"/><text x="526" y="999.675" font-family="-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#A78BFA" text-anchor="middle" letter-spacing="0.3px">INSERT</text><path d="M300,1054.0 C300,1031.6 560,1031.6 560,1054.0 L560,1122.0 C560,1144.4 300,1144.4 300,1122.0 Z" fill="#161320" stroke="#5B4A8A" stroke-width="1.4"/><path d="M300,1054.0 C300,1076.4 560,1076.4 560,1054.0" fill="none" stroke="#5B4A8A" stroke-width="1.4" opacity="0.6"/><text x="430.0" y="1082.0" font-family="-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#F2F1F7" text-anchor="middle">PostgreSQL</text><text x="430.0" y="1102.0" font-family="-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#8E8CA0" text-anchor="middle">+ pgvector</text><circle cx="1090" cy="1266" r="3.5" fill="#8B5CF6"/><text x="1102" y="1270" font-family="-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5F5D70" text-anchor="start" letter-spacing="1.5px">DASAIKO</text><rect x="840" y="118" width="400" height="620" rx="18" ry="18" fill="#131319" stroke="#232330" stroke-width="1" stroke-dasharray="3 5"/><text x="858" y="142" font-family="-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5F5D70" text-anchor="start" letter-spacing="1.6px">CORPUS RELATIONSHIP</text><text x="868" y="164" font-family="-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#5F5D70" text-anchor="start" letter-spacing="0.4px">DOCUMENT → CHUNKS → EMBEDDINGS</text><text x="868" y="180" font-family="-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#5F5D70" text-anchor="start" letter-spacing="0.4px">→ SEARCHABLE CORPUS</text><rect x="880" y="214" width="300" height="66" rx="10" ry="10" fill="#17171F" stroke="#31313D" stroke-width="1.2"/><text x="1030.0" y="241.0" font-family="-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#F2F1F7" text-anchor="middle">Document</text><text x="1030.0" y="259.0" font-family="-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#8E8CA0" text-anchor="middle">one uploaded PDF</text><path d="M1030.0,280 L1030.0,311.0 L1030.0,311.0 L1030.0,342" fill="none" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#arrow-accent)"/><rect x="1008.25" y="302.75" width="43.5" height="16.5" rx="5" ry="5" fill="#0A0A0E" stroke="none" stroke-width="0"/><text x="1030.0" y="314.675" font-family="-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#A78BFA" text-anchor="middle" letter-spacing="0.3px">1 : N</text><rect x="880" y="342" width="300" height="66" rx="10" ry="10" fill="#17171F" stroke="#31313D" stroke-width="1.2"/><text x="1030.0" y="369.0" font-family="-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#F2F1F7" text-anchor="middle">Chunks</text><text x="1030.0" y="387.0" font-family="-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#8E8CA0" text-anchor="middle">~1000-char text segments</text><path d="M1030.0,408 L1030.0,439.0 L1030.0,439.0 L1030.0,470" fill="none" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#arrow-accent)"/><rect x="1008.25" y="430.75" width="43.5" height="16.5" rx="5" ry="5" fill="#0A0A0E" stroke="none" stroke-width="0"/><text x="1030.0" y="442.675" font-family="-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#A78BFA" text-anchor="middle" letter-spacing="0.3px">1 : 1</text><rect x="880" y="470" width="300" height="66" rx="10" ry="10" fill="#17171F" stroke="#31313D" stroke-width="1.2"/><text x="1030.0" y="497.0" font-family="-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#F2F1F7" text-anchor="middle">Embeddings</text><text x="1030.0" y="515.0" font-family="-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#8E8CA0" text-anchor="middle">384-dim vector per chunk</text><path d="M1030.0,536 L1030.0,567.0 L1030.0,567.0 L1030.0,598" fill="none" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#arrow-accent)"/><rect x="880" y="598" width="300" height="66" rx="10" ry="10" fill="#17171F" stroke="#31313D" stroke-width="1.2"/><text x="1030.0" y="625.0" font-family="-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#F2F1F7" text-anchor="middle">Searchable Corpus</text><text x="1030.0" y="643.0" font-family="-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#8E8CA0" text-anchor="middle">queryable via vector + lexical search</text>
</svg>